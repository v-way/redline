<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<title>Redline</title>
	<style>
		html, body, #canvas { width: 100%; height: 100%; margin: 0; padding: 0; border: 0; }
		body { overflow: hidden; touch-action: none; background: #02070b; color: #e8f8ff; }
		#canvas { display: block; }
		#canvas:focus { outline: none; }
		#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; visibility: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; background: radial-gradient(circle at 50% 42%, #12304a 0, #06131e 44%, #02070b 75%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; z-index: 10; }
		#status-splash { width: min(72vw, 620px); max-height: 48vh; object-fit: contain; }
		#status-splash.show-image--false { display: none; }
		#status-splash.use-filter--false { image-rendering: pixelated; }
		#loading-title { color: #6ee9ff; font-size: 13px; font-weight: 700; letter-spacing: .28em; text-indent: .28em; text-transform: uppercase; }
		#loading-detail { min-height: 1.4em; color: #8ba9b8; font-size: 12px; letter-spacing: .08em; text-align: center; }
		#status-progress { display: none; width: min(70vw, 520px); height: 9px; border: 1px solid rgba(110, 233, 255, .52); border-radius: 999px; overflow: hidden; background: rgba(0, 0, 0, .52); accent-color: #43ddff; }
		#status-progress::-webkit-progress-value { background: linear-gradient(90deg, #168bc2, #55efff); box-shadow: 0 0 18px #43ddff; }
		#status-notice { display: none; max-width: 620px; margin: 0 24px; padding: 16px 20px; border: 1px solid #e24d42; border-radius: 8px; background: #32100e; line-height: 1.5; text-align: center; }
		#retry-button { display: none; min-width: 132px; min-height: 48px; padding: 0 22px; border: 1px solid #6ee9ff; border-radius: 8px; background: #0b3045; color: #e8f8ff; font: 700 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; }
		#retry-button:focus-visible { outline: 3px solid #ff4d45; outline-offset: 3px; }
		#orientation-gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: rgba(2, 7, 11, .96); color: #e8f8ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; z-index: 20; }
		body.orientation-required #orientation-gate { display: flex; }
		.orientation-card { width: min(100%, 360px); padding: 28px 24px; border: 1px solid rgba(110, 233, 255, .48); border-radius: 16px; background: linear-gradient(145deg, rgba(15, 48, 69, .98), rgba(4, 14, 23, .98)); box-shadow: 0 22px 64px rgba(0, 0, 0, .45); }
		.orientation-icon { display: block; width: 72px; height: 72px; margin: 0 auto 18px; color: #6ee9ff; }
		#orientation-title { margin: 0; font-size: clamp(21px, 6vw, 28px); line-height: 1.2; }
		#orientation-copy { margin: 12px 0 20px; color: #b8d0da; font-size: 15px; line-height: 1.55; }
			#orientation-button { min-width: 176px; min-height: 48px; padding: 12px 18px; border: 1px solid #6ee9ff; border-radius: 8px; background: #0b3045; color: #e8f8ff; font: 700 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; transition: background 180ms ease, transform 180ms ease; }
			#orientation-button:hover { background: #124963; }
			#orientation-button:active { transform: translateY(1px); }
			#orientation-button:disabled { cursor: wait; opacity: .72; }
			#orientation-button:focus-visible { outline: 3px solid #ff4d45; outline-offset: 3px; }
			#orientation-continue { min-height: 44px; margin-top: 12px; padding: 10px 14px; border: 0; background: transparent; color: #b8d0da; font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
			#orientation-continue:focus-visible { outline: 3px solid #ff4d45; outline-offset: 3px; }
		#orientation-detail { min-height: 1.4em; margin: 14px 0 0; color: #8ba9b8; font-size: 12px; line-height: 1.45; }
		@media (prefers-reduced-motion: reduce) { #orientation-button { transition: none; } }
	</style>
	<script>
		window.addEventListener('keydown', (event) => {
			if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
		}, { passive: false });
		window.addEventListener('wheel', (event) => event.preventDefault(), { passive: false });
	</script>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<noscript>Your browser does not support JavaScript.</noscript>
	<div id="status">
		<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
		<div id="loading-title">Loading Redline</div>
		<div id="loading-detail" role="status" aria-live="polite"></div>
		<progress id="status-progress" aria-label="Game loading progress"></progress>
		<div id="status-notice" role="alert"></div>
		<button id="retry-button" type="button">Retry</button>
	</div>
	<div id="orientation-gate" role="status" aria-live="polite" aria-labelledby="orientation-title" aria-describedby="orientation-copy orientation-detail">
		<div class="orientation-card">
			<svg class="orientation-icon" viewBox="0 0 72 72" fill="none" aria-hidden="true">
				<rect x="22" y="12" width="28" height="48" rx="4" stroke="currentColor" stroke-width="3" transform="rotate(90 36 36)" />
				<path d="M54 20a23 23 0 0 0-34 3" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
				<path d="M18 17l3 8 8-3" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
			</svg>
			<h1 id="orientation-title">Rotate your device</h1>
				<p id="orientation-copy">Landscape mode shows the full gauges, steering, and pedal controls.</p>
				<button id="orientation-button" type="button">Enter landscape mode</button>
				<button id="orientation-continue" type="button">Continue without rotating</button>
				<p id="orientation-detail">Loading will continue automatically after rotation.</p>
		</div>
	</div>
	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":42967232,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const GODOT_THREADS_ENABLED = false;
	const PACK_STALL_TIMEOUT_MS = 30000;
	const PACK_DOWNLOAD_ATTEMPTS = 3;
	const ORIENTATION_REQUEST_TIMEOUT_MS = 1500;

let godotCallback = null;
const isTabletDevice = () => {
	const isIPad = /iPad/.test(navigator.userAgent)
		|| (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
	const isAndroidTablet = /Android/.test(navigator.userAgent)
		&& navigator.maxTouchPoints > 0
		&& Math.min(screen.width, screen.height) >= 600;
	return isIPad || isAndroidTablet;
};

window.RedlinePokiBridge = {
	setGodotCallback(callback) { godotCallback = callback; },
	gameLoadingFinished() {},
	gameplayStart() {},
	gameplayStop() {},
	getDeviceCategory() {
		if (isTabletDevice()) return 'tablet';
		return matchMedia('(pointer: coarse)').matches ? 'mobile' : 'desktop';
	},
	commercialBreak() {
		if (godotCallback) godotCallback('commercial_started');
		queueMicrotask(() => { if (godotCallback) godotCallback('commercial_failed'); });
	},
};

(function start() {
	const overlay = document.getElementById('status');
	const progress = document.getElementById('status-progress');
	const title = document.getElementById('loading-title');
	const detail = document.getElementById('loading-detail');
	const notice = document.getElementById('status-notice');
	const retryButton = document.getElementById('retry-button');
		const orientationGate = document.getElementById('orientation-gate');
		const orientationButton = document.getElementById('orientation-button');
		const orientationContinueButton = document.getElementById('orientation-continue');
		const orientationDetail = document.getElementById('orientation-detail');
		let initializing = true;
		let startupStarted = false;
		let orientationBypassed = false;

		function requiresLandscape() {
			return matchMedia('(pointer: coarse)').matches && window.innerHeight > window.innerWidth;
		}

		function withTimeout(promise, message) {
			let timeoutId = 0;
			const timeout = new Promise((_, reject) => {
				timeoutId = window.setTimeout(() => reject(new Error(message)), ORIENTATION_REQUEST_TIMEOUT_MS);
			});
			return Promise.race([Promise.resolve(promise), timeout]).finally(() => window.clearTimeout(timeoutId));
		}

		async function requestLandscape() {
			orientationButton.disabled = true;
			orientationDetail.textContent = 'Requesting landscape mode…';
			try {
				if (document.fullscreenEnabled && !document.fullscreenElement) {
					await withTimeout(document.documentElement.requestFullscreen(), 'Fullscreen request timed out.');
				}
				if (screen.orientation?.lock) await withTimeout(screen.orientation.lock('landscape'), 'Landscape request timed out.');
				else orientationDetail.textContent = "This browser can't rotate automatically. Please turn your device manually.";
			} catch (_error) {
				orientationDetail.textContent = "This browser can't rotate automatically. Please turn your device manually.";
			} finally {
				orientationButton.disabled = false;
				syncOrientationGate();
			}
		}

	function setMode(mode) {
		if (!initializing) return;
		if (mode === 'hidden') { overlay.remove(); initializing = false; return; }
		overlay.style.visibility = 'visible';
		progress.style.display = mode === 'progress' ? 'block' : 'none';
		notice.style.display = mode === 'notice' ? 'block' : 'none';
		retryButton.style.display = mode === 'notice' ? 'block' : 'none';
	}

	function setProgress(current, total, stage) {
		title.textContent = stage;
		if (current > 0 && total > 0) {
			progress.value = current;
			progress.max = total;
			detail.textContent = `${Math.min(100, Math.round(current / total * 100))}%`;
		} else {
			progress.removeAttribute('value');
			progress.removeAttribute('max');
			detail.textContent = '';
		}
	}

	function fail(error) {
		console.error(error);
		notice.textContent = 'Redline could not finish loading on this device. Check that Safari and iPadOS are up to date, then retry.';
		detail.textContent = error instanceof Error ? error.message : String(error);
		setMode('notice');
	}

	function wait(milliseconds) {
		return new Promise((resolve) => setTimeout(resolve, milliseconds));
	}

	async function downloadPack(url, expectedSize) {
		let lastError = new Error('Game data download failed.');
		for (let attempt = 1; attempt <= PACK_DOWNLOAD_ATTEMPTS; attempt += 1) {
			const controller = new AbortController();
			let stallTimer = 0;
			const armStallTimer = () => {
				clearTimeout(stallTimer);
				stallTimer = setTimeout(() => controller.abort(), PACK_STALL_TIMEOUT_MS);
			};
			try {
				setProgress(0, 0, attempt === 1 ? 'Loading game data' : `Retrying game data ${attempt}/${PACK_DOWNLOAD_ATTEMPTS}`);
				armStallTimer();
				const response = await fetch(url, { credentials: 'same-origin', signal: controller.signal });
				if (!response.ok) throw new Error(`Game data request failed (${response.status}).`);
				if (!response.body) throw new Error('Streaming downloads are unavailable.');
				const bytes = new Uint8Array(expectedSize);
				const reader = response.body.getReader();
				let offset = 0;
				while (true) {
					armStallTimer();
					const result = await reader.read();
					if (result.done) break;
					if (offset + result.value.length > bytes.length) throw new Error('Game data exceeded its expected size.');
					bytes.set(result.value, offset);
					offset += result.value.length;
					setProgress(offset, expectedSize, 'Loading game data');
				}
				if (offset !== expectedSize) throw new Error(`Game data was incomplete (${offset}/${expectedSize}).`);
				clearTimeout(stallTimer);
				return bytes.buffer;
			} catch (error) {
				clearTimeout(stallTimer);
				lastError = error;
				if (attempt < PACK_DOWNLOAD_ATTEMPTS) await wait(1000);
			}
		}
		throw lastError;
	}

	function bootGame() {
		if (startupStarted) return;
		startupStarted = true;
		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length) { fail(new Error(`Required browser features are missing: ${missing.join(', ')}`)); return; }

		setMode('progress');
		const executable = GODOT_CONFIG.executable;
		const pack = GODOT_CONFIG.mainPack || `${executable}.pck`;
		const packSize = GODOT_CONFIG.fileSizes[pack];
		const engine = new Engine({
			...GODOT_CONFIG,
			onProgress(current, total) { setProgress(current, total, 'Loading engine'); },
		});
		engine.init(executable)
			.then(() => downloadPack(pack, packSize))
			.then((packBuffer) => engine.preloadFile(packBuffer, pack))
			.then(() => engine.start({ args: ['--main-pack', pack] }))
			.then(() => setMode('hidden'), fail);
	}

		function syncOrientationGate() {
			const portraitTouchDevice = !orientationBypassed && requiresLandscape();
			document.body.classList.toggle('orientation-required', portraitTouchDevice);
			orientationGate.setAttribute('aria-hidden', String(!portraitTouchDevice));
			if (portraitTouchDevice) return;
			bootGame();
		}

		function continueWithoutRotating() {
			orientationBypassed = true;
			syncOrientationGate();
		}

		retryButton.addEventListener('click', () => location.reload());
		orientationButton.addEventListener('click', requestLandscape);
		orientationContinueButton.addEventListener('click', continueWithoutRotating);
	window.addEventListener('orientationchange', syncOrientationGate);
	matchMedia('(orientation: portrait)').addEventListener?.('change', syncOrientationGate);
	syncOrientationGate();
}());
	</script>
</body>
</html>
