<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#080a0e">
	<meta name="description" content="启动 Redline，进入单圈 3D 拉力挑战。">
	<title>Redline — 启动游戏</title>
	<style>
		:root {
			color-scheme: dark;
			--background: #080a0e;
			--surface: rgba(18, 22, 29, .9);
			--text: #f7f7f8;
			--muted: #b8bec8;
			--line: rgba(255, 255, 255, .14);
			--red: #e5393f;
			--red-hover: #f34b51;
			--cyan: #78dce8;
		}

		*, *::before, *::after { box-sizing: border-box; }

		html { background: var(--background); }

		body {
			min-width: 320px;
			min-height: 100svh;
			margin: 0;
			background:
				radial-gradient(circle at 50% 18%, rgba(229, 57, 63, .16), transparent 28rem),
				linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
				var(--background);
			background-size: auto, 52px 52px, 52px 52px, auto;
			color: var(--text);
			font-family: "Segoe UI", Arial, Helvetica, sans-serif;
			-webkit-font-smoothing: antialiased;
		}

		main {
			display: grid;
			place-items: center;
			min-height: 100svh;
			padding:
				max(24px, env(safe-area-inset-top))
				max(20px, env(safe-area-inset-right))
				max(24px, env(safe-area-inset-bottom))
				max(20px, env(safe-area-inset-left));
		}

		.launcher {
			position: relative;
			width: min(100%, 620px);
			padding: clamp(36px, 8vw, 72px) clamp(24px, 8vw, 68px);
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 20px;
			background: var(--surface);
			box-shadow: 0 28px 90px rgba(0, 0, 0, .42);
			text-align: center;
		}

		.launcher::before {
			position: absolute;
			top: 0;
			left: 20%;
			width: 60%;
			height: 2px;
			background: linear-gradient(90deg, transparent, var(--red), transparent);
			content: "";
		}

		.brand-mark {
			display: inline-block;
			position: relative;
			width: 48px;
			height: 21px;
			margin-bottom: 24px;
			transform: skewX(-18deg);
		}

		.brand-mark::before,
		.brand-mark::after {
			position: absolute;
			left: 0;
			height: 6px;
			background: var(--red);
			content: "";
		}

		.brand-mark::before { top: 0; width: 48px; }
		.brand-mark::after { bottom: 0; width: 32px; }

		h1 {
			margin: 0;
			font-size: clamp(48px, 12vw, 82px);
			font-weight: 700;
			letter-spacing: -.02em;
			line-height: 1;
		}

		.tagline {
			margin: 18px 0 32px;
			color: var(--muted);
			font-size: clamp(16px, 3vw, 19px);
			line-height: 1.6;
		}

		.start-game {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: min(100%, 270px);
			min-height: 58px;
			padding: 14px 24px;
			border: 1px solid var(--red);
			border-radius: 8px;
			background: var(--red);
			box-shadow: 0 14px 38px rgba(229, 57, 63, .28);
			color: #fff;
			cursor: pointer;
			font-size: 16px;
			font-weight: 700;
			letter-spacing: .08em;
			text-decoration: none;
			touch-action: manipulation;
			transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
		}

		.start-game::after {
			width: 0;
			height: 0;
			margin-left: 13px;
			border-top: 6px solid transparent;
			border-bottom: 6px solid transparent;
			border-left: 10px solid currentColor;
			content: "";
		}

		.start-game:hover {
			border-color: var(--red-hover);
			background: var(--red-hover);
			box-shadow: 0 17px 44px rgba(229, 57, 63, .38);
			transform: translateY(-2px);
		}

		.start-game:active { transform: translateY(0); }

		.start-game:focus-visible {
			outline: 3px solid var(--cyan);
			outline-offset: 5px;
		}

		.support-note {
			margin: 20px 0 0;
			color: #969daa;
			font-size: 13px;
			line-height: 1.5;
		}

		@media (max-width: 480px) {
			.launcher { border-radius: 14px; }
			.tagline { margin-bottom: 28px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.start-game { transition: none; }
		}
	</style>
</head>
<body>
	<main>
		<div class="launcher">
			<span class="brand-mark" aria-hidden="true"></span>
			<h1>Redline</h1>
			<p class="tagline">一圈定胜负。现在进入赛道。</p>
			<a class="start-game" href="./game/index.html" aria-describedby="support-note">启动游戏</a>
			<p class="support-note" id="support-note">桌面端使用键盘，手机和平板使用触控操作</p>
		</div>
	</main>
</body>
</html>
